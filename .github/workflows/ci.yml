name: CI — Type Check, Lint & Screenshot Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  NEXT_PUBLIC_USE_DEMO_SEED: "true"
  NEXT_PUBLIC_SUPABASE_URL: "https://placeholder-project.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Type-check + Lint
  # ─────────────────────────────────────────────────────────────────────────────
  type-check-and-lint:
    name: 🔍 TypeScript & ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type-check (strict)
        run: npm run type-check

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Production build verification
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: 🏗️ Next.js Production Build
    runs-on: ubuntu-latest
    needs: type-check-and-lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: Screenshot regression testing
  # ─────────────────────────────────────────────────────────────────────────────
  screenshot-regression:
    name: 📸 Screenshot Regression (1440px / 1024px / 390px)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies (including Puppeteer)
        run: npm ci

      - name: Install Chrome dependencies for Puppeteer on Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: .next/

      - name: Start Next.js production server
        run: |
          npm start &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          sleep 4

      - name: Create screenshots directory
        run: mkdir -p tasks/screenshots/ci

      - name: Capture dashboard screenshots at 3 breakpoints
        run: |
          cat > /tmp/ci-screenshots.js << 'SCRIPT'
          const puppeteer = require("puppeteer");
          const path = require("path");

          async function capture() {
            const browser = await puppeteer.launch({
              headless: "new",
              args: [
                "--no-sandbox",
                "--disable-setuid-sandbox",
                "--disable-dev-shm-usage",
                "--disable-gpu",
              ],
            });

            const page = await browser.newPage();

            const viewports = [
              { name: "desktop-1440px", width: 1440, height: 900 },
              { name: "tablet-1024px",  width: 1024, height: 768 },
              { name: "mobile-390px",   width: 390,  height: 844 },
            ];

            for (const vp of viewports) {
              await page.setViewport({ width: vp.width, height: vp.height, deviceScaleFactor: 1 });
              await page.goto("http://localhost:3000", { waitUntil: "networkidle0", timeout: 30000 });
              await new Promise((r) => setTimeout(r, 1500));

              const filePath = path.join("tasks/screenshots/ci", `${vp.name}.png`);
              await page.screenshot({ path: filePath, fullPage: false });
              console.log(`✓ Captured ${vp.name} → ${filePath}`);
            }

            await browser.close();
            console.log("All CI screenshots captured successfully.");
          }

          capture().catch((err) => {
            console.error("Screenshot capture failed:", err);
            process.exit(1);
          });
          SCRIPT
          node /tmp/ci-screenshots.js

      - name: Verify screenshots were created
        run: |
          echo "Generated screenshots:"
          ls -lh tasks/screenshots/ci/

      - name: Upload screenshots as CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-screenshots-${{ github.run_id }}
          path: tasks/screenshots/ci/
          retention-days: 30

      - name: Stop production server
        if: always()
        run: kill $SERVER_PID || true

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4: SQL migration lint (validate Supabase migration syntax)
  # ─────────────────────────────────────────────────────────────────────────────
  migration-lint:
    name: 🗃️ SQL Migration Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify migration files exist
        run: |
          if [ ! -f "supabase/migrations/00001_initial_schema.sql" ]; then
            echo "❌ Migration file missing!"
            exit 1
          fi
          echo "✅ Migration file exists: supabase/migrations/00001_initial_schema.sql"
          echo "   Size: $(wc -c < supabase/migrations/00001_initial_schema.sql) bytes"

      - name: Verify seed file exists
        run: |
          if [ ! -f "supabase/seed.sql" ]; then
            echo "❌ Seed file missing!"
            exit 1
          fi
          echo "✅ Seed file exists: supabase/seed.sql"
          echo "   Size: $(wc -c < supabase/seed.sql) bytes"

      - name: Check SQL for common syntax issues
        run: |
          # Check for unbalanced dollar-quote blocks ($$)
          SCHEMA_FILE="supabase/migrations/00001_initial_schema.sql"
          DOLLAR_COUNT=$(grep -o '\$\$' "$SCHEMA_FILE" | wc -l)
          echo "Dollar-quote pairs in schema: $((DOLLAR_COUNT / 2)) (count: $DOLLAR_COUNT)"
          if [ $((DOLLAR_COUNT % 2)) -ne 0 ]; then
            echo "❌ Unbalanced \$\$ blocks detected in schema!"
            exit 1
          fi
          echo "✅ SQL migration syntax check passed"

