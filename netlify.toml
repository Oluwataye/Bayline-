[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_USE_DEMO_SEED = "true"
  NEXT_PUBLIC_SUPABASE_URL = "https://placeholder-project.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY = "placeholder-anon-key"

[[plugins]]
  package = "@netlify/plugin-nextjs"
